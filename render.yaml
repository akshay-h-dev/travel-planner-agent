services:
  - type: web
    name: tripway-api
    runtime: node
    region: singapore    # change to oregon / frankfurt to match your users
    plan: free           # upgrade to starter ($7/mo) to avoid spin-down
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.20.0"
      - key: GROQ_API_KEY
        sync: false          # Render will prompt you to enter this in the dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL e.g. https://tripway.vercel.app
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "20"
      # Optional — leave blank if you do not have these keys
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
